---
- name: Adicionar repositório Helm do Jetstack
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io

- name: Atualizar cache de repositórios Helm
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Instalar cert-manager via Helm
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    release_namespace: "{{ cert_manager_namespace }}"
    create_namespace: true
    chart_version: "{{ cert_manager_version }}"
    values:
      installCRDs: true
    wait: true

- name: Criar Secret com token da API Cloudflare
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-api-token
        namespace: "{{ cert_manager_namespace }}"
      type: Opaque
      stringData:
        api-token: "{{ vault_cloudflare_api_token }}"

- name: Criar ClusterIssuer Let's Encrypt staging
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'clusterissuer-staging.yaml.j2') }}"

- name: Criar ClusterIssuer Let's Encrypt produção
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'clusterissuer-prod.yaml.j2') }}"