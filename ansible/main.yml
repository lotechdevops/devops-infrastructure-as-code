- name: Configurar servidor NFS pro cluster Kubernetes
  hosts: nfsServer
  become: true
  roles:
    - nfs-server
  tags:
    - nfs-server

- name: Instalar provisioner NFS no cluster
  hosts: localhost
  connection: local
  roles:
    - nfs-provisioner
  tags:
    - nfs-provisioner

- name: Instalar kube-prometheus-stack
  hosts: localhost
  connection: local
  vars:
    kube_prometheus_stack_version: "87.19.0"
  roles:
    - kube-prometheus-stack
  tags:
    - kube-prometheus-stack

- name: Instalar Cert-Manager
  hosts: localhost
  connection: local
  roles:
    - cert-manager
  tags:
    - cert-manager 

- name: Instalar e Configurar Metallb
  hosts: localhost
  connection: local
  roles:
    - metallb
  tags:
    - metallb

- name: Instalar Argo CD
  hosts: localhost 
  gather_facts: false
  roles:
    - argocd
  tags:
    - argocd