apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
  namespace: nginx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-hpa
  minReplicas: 3             
  maxReplicas: 5             
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30    
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 50   
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60    
      policies:
      - type: Percent
        value: 100                     
        periodSeconds: 10              
    scaleDown:
      stabilizationWindowSeconds: 60   
      policies:
      - type: Percent
        value: 50                       
        periodSeconds: 60